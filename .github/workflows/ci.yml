# CI 闸门：push main 与所有 PR 跑 typecheck + build + test + 打包一致性校验。
# 发布仍走 release.yml（tag 触发），本工作流不发布任何产物。
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0 # 与 release.yml 保持一致

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (typecheck + build)
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Verify package
        run: node scripts/verify-package.mjs
